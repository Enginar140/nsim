[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Enginar140/nsim"
homepage = "https://github.com/Enginar140/nsim"
authors = ["The NSIM Contributors"]

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[workspace.dependencies]
nsim-core = { path = "crates/nsim-core", version = "0.0.0" }
nsim-physics = { path = "crates/nsim-physics", version = "0.0.0" }
nsim-physics-rapier = { path = "crates/nsim-physics-rapier", version = "0.0.0" }

# Optimize dependencies (Rapier, nalgebra) even in dev/test builds: physics
# tests run ~10x faster, while our own crates stay quick to compile and debug.
[profile.dev.package."*"]
opt-level = 2
